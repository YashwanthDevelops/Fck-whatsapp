name: PrivateMessenger
options:
  bundleIdPrefix: dev.friendline
  deploymentTarget:
    iOS: "16.0"
packages:
  MatrixRustSDK:
    url: https://github.com/matrix-org/matrix-rust-components-swift
    exactVersion: 26.09.07
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.17.0
targets:
  PrivateMessenger:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    dependencies:
      - package: MatrixRustSDK
        product: MatrixRustSDK
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.friendline.messenger.ios
        PRODUCT_NAME: Private Messenger
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Private Messenger
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your private development homeserver on the local network.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record voice messages for encrypted conversations. Audio is encrypted on this device before it is sent.
        INFOPLIST_KEY_NSCameraUsageDescription: Make encrypted video calls with people in your private conversations.
        INFOPLIST_KEY_MatrixPushEnabled: "$(MATRIX_PUSH_ENABLED)"
        INFOPLIST_KEY_MatrixPushDomain: "$(MATRIX_PUSH_DOMAIN)"
        INFOPLIST_KEY_MatrixPushAppID: "$(MATRIX_PUSH_APP_ID)"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_ENTITLEMENTS: PrivateMessenger.entitlements
        MATRIX_PUSH_ENABLED: NO
        MATRIX_PUSH_DOMAIN: ""
        MATRIX_PUSH_APP_ID: dev.friendline.messenger.ios
        APS_ENVIRONMENT: development
      configs:
        debug:
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
          APS_ENVIRONMENT: development
          MATRIX_PUSH_APP_ID: dev.friendline.messenger.ios.dev
        release:
          APS_ENVIRONMENT: production
          MATRIX_PUSH_APP_ID: dev.friendline.messenger.ios
