services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  synapse:
    image: ghcr.io/element-hq/synapse:v1.161.0
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:-localhost}
      SYNAPSE_REPORT_STATS: ${SYNAPSE_REPORT_STATS:-no}
      SYNAPSE_PUBLIC_BASEURL: ${SYNAPSE_PUBLIC_BASEURL:-http://localhost:8008/}
    ports:
      - "${SYNAPSE_BIND_ADDRESS:-127.0.0.1}:${SYNAPSE_HTTP_PORT:-8008}:8008"
    volumes:
      - ../../data/synapse:/data
      - ./configure.py:/opt/configure.py:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/_matrix/client/versions', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [private]

networks:
  private:
    driver: bridge
