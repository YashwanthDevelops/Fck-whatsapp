name: friendline-private

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine}
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Synapse requires C collation/ctype; these args only apply to a new volume.
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - database

  synapse:
    image: ${SYNAPSE_IMAGE:-ghcr.io/element-hq/synapse:v1.161.0}
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      SYNAPSE_SERVER_NAME: ${MATRIX_SERVER_NAME:?Set MATRIX_SERVER_NAME to the existing Matrix identity}
      SYNAPSE_REPORT_STATS: "no"
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?Set MATRIX_SERVER_NAME to the existing Matrix identity}
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:?Set MATRIX_DOMAIN to the stable domain you own}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      CADDY_PROXY_IP: ${CADDY_PROXY_IP:-172.30.255.2}
      PROXY_NETWORK_SUBNET: ${PROXY_NETWORK_SUBNET:-172.30.255.0/29}
    secrets:
      - postgres_password
    volumes:
      - synapse_data:/data
      - ./configure.py:/opt/private-deployment/configure.py:ro
    expose:
      - "8008"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/_matrix/client/versions', timeout=5).read()
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    stop_grace_period: 1m
    networks:
      - database
      - proxy

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:?Set MATRIX_DOMAIN to the stable domain you own}
      CALLS_DOMAIN: ${CALLS_DOMAIN:-localhost}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      synapse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      proxy:
        aliases:
          - ${MATRIX_DOMAIN:?Set MATRIX_DOMAIN to the stable domain you own}
        ipv4_address: ${CADDY_PROXY_IP:-172.30.255.2}
      rtc: {}
      edge: {}

  sygnal:
    image: ${SYGNAL_IMAGE:-matrixdotorg/sygnal:v0.17.0}
    profiles:
      - push
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      SYGNAL_CONF: /sygnal/sygnal.yaml
    volumes:
      - ./sygnal.yaml:/sygnal/sygnal.yaml:ro
      - ./credentials:/run/secrets:ro
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy
      - edge

  call-auth:
    profiles:
      - calls
    build:
      context: ./call-auth
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      MATRIX_BASE_URL: http://synapse:8008
      LIVEKIT_URL: wss://${CALLS_DOMAIN:-localhost}
      LIVEKIT_KEYS_FILE: /run/secrets/livekit_keys
      PORT: "8080"
    secrets:
      - livekit_keys
    expose:
      - "8080"
    depends_on:
      synapse:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - proxy

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.7}
    profiles:
      - calls
    restart: unless-stopped
    logging: *bounded-logging
    command: ["--key-file", "/run/secrets/livekit_keys"]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: warn
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        turn:
          enabled: true
          domain: ${CALLS_DOMAIN:-localhost}
          udp_port: 443
          relay_range_start: 40000
          relay_range_end: 40099
          per_user_relay_allocation_limit: 8
    secrets:
      - livekit_keys
    ports:
      - "443:443/udp"
      - "7881:7881/tcp"
      - "40000-40099:40000-40099/udp"
      - "50000-50100:50000-50100/udp"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - rtc
      - edge

networks:
  database:
    internal: true
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${PROXY_NETWORK_SUBNET:-172.30.255.0/29}
  rtc:
    internal: true
  edge:
    driver: bridge

volumes:
  postgres_data:
  synapse_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE to a protected password file}
  livekit_keys:
    file: ${LIVEKIT_KEYS_FILE:-./call-auth/livekit_keys.disabled.example}
